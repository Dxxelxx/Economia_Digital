<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block titulo %}
        Taller El Obrero
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<!-- ================================= -->
<!-- BARRA SUPERIOR -->
<!-- ================================= -->

<header class="barra-navegacion">

    <!-- IZQUIERDA -->

    <nav class="nav-izquierda">

        <a
            href="{{ url_for('principal.inicio') }}"
            class="nav-enlace"
        >

            <span class="nav-icono">⌂</span>

            <span>Inicio</span>

        </a>

    </nav>


    <!-- DERECHA -->

    <nav class="nav-derecha">

        <a
            href="{{ url_for('auth.login') }}"
            class="nav-enlace"
        >

            <span class="nav-icono">♙</span>

            <span>Iniciar sesión</span>

        </a>


        <a
            href="{{ url_for('auth.registro') }}"
            class="nav-enlace nav-registro"
        >

            <span class="nav-icono">✦</span>

            <span>Registrarse</span>

        </a>

    </nav>

</header>



<!-- ================================= -->
<!-- CONTENIDO PRINCIPAL -->
<!-- ================================= -->

<main>

    {% block contenido %}

    {% endblock %}

</main>



<!-- ================================= -->
<!-- PIE DE PÁGINA -->
<!-- ================================= -->

<footer>

    <p>
        © 2026 Taller El Obrero
    </p>

</footer>


</body>

</html>
